server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Keep directory redirects relative behind host port mappings and proxies.
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Serve each prerendered article directly; unknown routes retain HTTP 404.
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    error_page 404 /404.html;
}
